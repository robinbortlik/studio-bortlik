- name: Chemický peeling (obličej + krk) - 900 Kč
  bullets:
    - odlíčení a tonizace
    - příprava pleti
    - aplikace peelingu
    - neutralizace
    - zklidnění pleti + maska
    - aplikace krému
  notes:
    "Po aplikaci peelingu je nutné používat ochranný bariérový krém a SPF krém pro denní péči.
    <br />Chemický peeling provádím pouze po předchozí konzultaci.
    <br />U mých stálých klientů je aplikace možná v rámci kosmetické péče v salonu."  
