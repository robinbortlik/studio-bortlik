- name: Basic / Prevence Akné / Rosacea - 950 Kč
  bullets:
    - odlíčení a tonizace pleti
    - enzymatický peeling + neutralizace / exfoliační maska
    - aplikace gelového změkčovadla + hloubkové čištění pleti, dezinfekce pleti
    - aplikace pleťového séra / boosteru nebo ampule
    - aplikace pleťové masky / vrstvení masek + oční obklad
    - aplikace denního krému, očního krému, ochranné masti na rty
    - úprava obočí
    - depilace chloupků nad horním rtem
  notes:
    "Dle stavu a aktuálních potřeb klientky využívám přístrojovou techniku:  Ultrazvuková špachtle, (Ozonizér), PDT tunel, Kosmetický ultrazvuk
    <br /><br /> Péče je vhodná pro: normální a smíšenou, mastnou, aknózní nebo citlivou pleť"
  time: 90 - 120 min, dle potřeby a stavu pleti

- name: Anti Age + Dekolt - 1150 Kč
  bullets:
    - odlíčení a tonizace pleti
    - enzymatický peeling + neutralizace / exfoliační maska
    - masáž obličeje a dekoltu
    - aplikace pleťového séra / boosteru, ampule
    - aplikace pleťové masky, oční obklad
    - aplikace denního krému, očního krému, ochranné masti na rty
    - úprava obočí
    - depilace chloupků nad horním rtem
  notes:
    "Dle stavu a aktuálních potřeb klientky využívám přístrojovou techniku: Kosmetický ultrazvuk, PDT tunel
    <br /><br /> Vhodné pro: Zralou pleť, suchou pleť, prevence stárnutí pleti. <br /> Není vhodné ihned po aplikaci hyaluronových výplní nebo botulotoxinu."
  time: 120 - 150 min

